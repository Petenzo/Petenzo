<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root {
    --bg: #020818; --panel: rgba(8, 28, 64, .55); --line: rgba(64, 160, 255, .28);
    --ink: #cfe6ff; --dim: #6f93bd; --accent: #38b6ff; --hot: #7fe0ff; --warn: #ffb347; --bad: #ff5d6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #06204a 0%, var(--bg) 65%);
    color: var(--ink); font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; letter-spacing: .45em; margin: 0; color: var(--hot); }
  #status { color: var(--dim); text-transform: uppercase; letter-spacing: .18em; font-size: 12px; }
  #status b { color: var(--accent); font-weight: 600; }
  #stats { margin-left: auto; display: flex; gap: 22px; color: var(--dim); font-size: 12px; }
  #stats span b { color: var(--ink); font-size: 15px; margin-right: 6px; }
  main { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(300px, 1.3fr) minmax(220px, 1fr); gap: 16px; padding: 16px 20px; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; backdrop-filter: blur(4px); }
  .panel h2 { margin: 0; padding: 9px 12px; font-size: 11px; letter-spacing: .3em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .scroll { overflow-y: auto; padding: 10px 12px; flex: 1; }
  .scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: var(--line); }
  .row { margin: 0 0 9px; overflow-wrap: anywhere; }
  .row time { color: var(--dim); font-size: 11px; margin-right: 8px; }
  .row.you { color: var(--hot); } .row.you::before { content: "TY › "; color: var(--dim); }
  .row.jarvis::before { content: "JARVIS › "; color: var(--accent); }
  .row.err { color: var(--bad); }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #orb { width: 100%; height: 100%; cursor: pointer; }
  #heard { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; color: var(--hot); min-height: 1.5em; padding: 0 12px; text-shadow: 0 0 12px rgba(56,182,255,.6); }
  #permission { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(92%, 440px); background: rgba(40, 24, 4, .92); border: 1px solid var(--warn); border-radius: 6px; padding: 12px 14px; display: none; }
  #permission.on { display: block; }
  #permission h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .25em; color: var(--warn); }
  #permission p { margin: 0 0 10px; overflow-wrap: anywhere; }
  footer { display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: rgba(56,182,255,.1); border: 1px solid var(--line); border-radius: 4px; padding: 9px 14px; cursor: pointer; letter-spacing: .08em; }
  button:hover { border-color: var(--accent); }
  button.on { background: rgba(56,182,255,.3); border-color: var(--hot); color: #fff; }
  button.yes { border-color: #5fd38d; color: #b8f5cf; } button.no { border-color: var(--bad); color: #ffc2c8; }
  input[type=text] { flex: 1; min-width: 180px; font: inherit; color: var(--ink); background: rgba(0,10,30,.6); border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; }
  input[type=text]:focus, button:focus-visible { outline: 1px solid var(--hot); }
  #hint { width: 100%; color: var(--dim); font-size: 12px; margin: 0; }
  @media (max-width: 860px) {
    body { overflow: auto; } main { grid-template-columns: 1fr; } #stage { height: 46vh; order: -1; } .panel { max-height: 30vh; }
    #stats { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <div id="status">Status: <b id="statusText">łączenie…</b></div>
  <div id="stats">
    <span><b id="nCmd">0</b>polecenia</span>
    <span><b id="nAct">0</b>akcje</span>
    <span><b id="cost">$0.00</b>koszt sesji</span>
  </div>
</header>

<main>
  <section class="panel"><h2>DZIAŁANIA</h2><div class="scroll" id="actions"></div></section>
  <section id="stage">
    <canvas id="orb" title="Kliknij, żeby uciszyć Jarvisa"></canvas>
    <div id="permission">
      <h3>POTRZEBNA ZGODA</h3>
      <p id="permText"></p>
      <button class="yes" id="permYes">TAK</button>
      <button class="no" id="permNo">NIE</button>
    </div>
    <div id="heard"></div>
  </section>
  <section class="panel"><h2>ROZMOWA</h2><div class="scroll" id="talk"></div></section>
</main>

<footer>
  <button id="mic" title="Powiedz jedno polecenie">🎙 MÓW</button>
  <button id="wake" title="Ciągły nasłuch: słowo „Jarvis” albo dwa klaśnięcia">NASŁUCH: WYŁ.</button>
  <input type="text" id="text" placeholder="…albo napisz polecenie i wciśnij Enter" autocomplete="off">
  <button id="stop">STOP</button>
  <button id="reset" title="Zacznij nową rozmowę (pamięć zostaje)">NOWA ROZMOWA</button>
  <p id="hint"></p>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const post = (url, body = {}) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const stamp = () => new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// ---------- stan ----------
let busy = false;            // agent pracuje
let speaking = false;        // syntezator mówi
let quietUntil = 0;          // ignoruj mikrofon chwilę po mowie Jarvisa (echo)
let armedUntil = 0;          // następna wypowiedź to polecenie
let wakeOn = false;          // ciągły nasłuch
let recRunning = false;
let permission = null;       // { id }
let micLevel = 0;
let stats = { cmd: 0, act: 0, cost: 0 };

function log(target, text, cls = '') {
  const row = document.createElement('p');
  row.className = 'row ' + cls;
  const t = document.createElement('time');
  t.textContent = stamp();
  row.append(t, document.createTextNode(text));
  $(target).append(row);
  $(target).scrollTop = $(target).scrollHeight;
}

function refreshStatus() {
  const armed = Date.now() < armedUntil;
  $('statusText').textContent = permission ? 'czekam na zgodę' : speaking ? 'mówię' : busy ? 'pracuję' : armed ? 'słucham' : wakeOn ? 'czuwam' : 'gotowy';
  $('nCmd').textContent = stats.cmd;
  $('nAct').textContent = stats.act;
  $('cost').textContent = '$' + stats.cost.toFixed(2);
  $('mic').classList.toggle('on', armed);
}
setInterval(refreshStatus, 300);

// ---------- wysyłanie poleceń ----------
async function send(text) {
  text = text.trim();
  if (!text) return;
  if (busy) { log('talk', 'Jeszcze pracuję nad poprzednim poleceniem. Powiedz „stop”, żeby przerwać.', 'err'); return; }
  stopSpeaking();
  armedUntil = 0;
  log('talk', text, 'you');
  stats.cmd++;
  busy = true;
  const res = await post('/api/ask', { text }).catch(() => null);
  if (!res || !res.ok) { busy = false; log('talk', 'Nie udało się wysłać polecenia do serwera.', 'err'); }
}

function answerPermission(allow) {
  if (!permission) return;
  post('/api/permission', { id: permission.id, allow });
  stopSpeaking();
}

// ---------- zdarzenia z serwera ----------
const events = new EventSource('/events');
events.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'status') busy = ev.state === 'thinking';
  if (ev.type === 'say') { log('talk', ev.text, 'jarvis'); speak(ev.text); }
  if (ev.type === 'tool') { stats.act++; log('actions', ev.summary); }
  if (ev.type === 'error') { log('talk', ev.text, 'err'); speak('Coś poszło nie tak.'); }
  if (ev.type === 'done' && ev.cost) stats.cost += ev.cost;
  if (ev.type === 'permission') {
    permission = { id: ev.id };
    $('permText').textContent = ev.summary;
    $('permission').classList.add('on');
    log('actions', 'Pytam o zgodę: ' + ev.summary);
    speak('Potrzebuję zgody. ' + ev.summary.split(':')[0] + '. Tak czy nie?');
  }
  if (ev.type === 'permission_closed' && permission?.id === ev.id) {
    permission = null;
    $('permission').classList.remove('on');
    log('actions', ev.allowed ? 'Zgoda udzielona.' : 'Odmowa.');
  }
  refreshStatus();
};
events.onerror = () => { $('statusText').textContent = 'brak połączenia z serwerem'; };

// ---------- mowa Jarvisa ----------
let voice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('pl'));
  voice = voices.find((v) => /google|natural|online/i.test(v.name)) || voices[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function forSpeech(text) {
  return text
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/https?:\/\/\S+/g, ' link ')
    .replace(/[*_#`>|]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

let speechQueue = 0;
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  // Długie wypowiedzi tniemy na zdania — Chrome potrafi urwać długą kwestię w połowie.
  const parts = forSpeech(text).match(/[^.!?]+[.!?]*/g) || [];
  for (const part of parts) {
    if (!part.trim()) continue;
    const u = new SpeechSynthesisUtterance(part.trim());
    u.lang = 'pl-PL';
    if (voice) u.voice = voice;
    u.rate = 1.05;
    u.onstart = () => { speaking = true; };
    u.onend = u.onerror = () => {
      speechQueue--;
      if (speechQueue <= 0) { speechQueue = 0; speaking = false; quietUntil = Date.now() + 600; }
    };
    speechQueue++;
    speechSynthesis.speak(u);
  }
}
function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speechQueue = 0; speaking = false; quietUntil = Date.now() + 300;
}

// ---------- rozpoznawanie mowy ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE = /\b(?:jarvis|jarwis|dżarwis|dżarvis|dziarwis|czarwis|dżarwiz|jarvisie|dżarwisie)\b[\s,.!?:]*(.*)$/i;
const YES = /\b(tak|jasne|dawaj|zgoda|zrób|rób|potwierdzam|okej|ok|pewnie|śmiało)\b/i;
const NO = /\b(nie|stop|anuluj|zostaw|odmawiam)\b/i;
let rec = null;

function chime() {
  const ctx = audioCtx || new AudioContext();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.12, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .18);
  o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .2);
}
function arm(ms = 9000) { armedUntil = Date.now() + ms; chime(); refreshStatus(); }

function onUtterance(text) {
  text = text.trim();
  if (!text) return;
  if (permission) {
    if (NO.test(text)) return answerPermission(false);
    if (YES.test(text)) return answerPermission(true);
    return;
  }
  if (busy) {
    if (/\b(stop|przerwij|przestań|wystarczy)\b/i.test(text)) { post('/api/stop'); stopSpeaking(); }
    return;
  }
  if (Date.now() < armedUntil) return send(text.replace(WAKE, (m, rest) => rest || m));
  const hit = text.match(WAKE);
  if (!hit) return;
  if (hit[1].trim().length > 2) send(hit[1]); else arm();
}

function startRec() {
  if (!SR || recRunning) return;
  rec = new SR();
  rec.lang = 'pl-PL'; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => { recRunning = true; };
  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript;
      const muted = speaking || Date.now() < quietUntil;
      if (!e.results[i].isFinal) { if (!muted) $('heard').textContent = text; continue; }
      $('heard').textContent = '';
      // W trakcie mowy Jarvisa przepuszczamy tylko odpowiedź na pytanie o zgodę.
      if (muted && !permission) continue;
      onUtterance(text);
    }
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wakeOn = false; armedUntil = 0; syncWake();
      $('hint').textContent = 'Przeglądarka zablokowała mikrofon — zezwól na niego przy pasku adresu i spróbuj ponownie.';
    }
  };
  rec.onend = () => {
    recRunning = false;
    if (wakeOn || Date.now() < armedUntil || permission) setTimeout(startRec, 250);
  };
  try { rec.start(); } catch {}
}
function stopRec() { try { rec?.stop(); } catch {} }

// ---------- mikrofon: poziom dźwięku i klaśnięcia ----------
let audioCtx = null, analyser = null, samples = null, ambient = 0.02, lastClap = 0;
async function startMeter() {
  if (analyser) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    samples = new Float32Array(analyser.fftSize);
  } catch {}
}
function readMeter() {
  if (!analyser) return;
  analyser.getFloatTimeDomainData(samples);
  let peak = 0;
  for (const s of samples) { const a = Math.abs(s); if (a > peak) peak = a; }
  micLevel += (peak - micLevel) * 0.3;
  const now = performance.now();
  const sharp = peak > Math.max(0.4, ambient * 8);
  ambient += (peak - ambient) * 0.02;
  if (!sharp || !wakeOn || speaking || busy || now - lastClap < 130) return;
  if (now - lastClap < 800) { lastClap = 0; if (Date.now() > armedUntil) arm(); }
  else lastClap = now;
}

// ---------- kula ----------
const canvas = $('orb'), g = canvas.getContext('2d');
function resize() {
  const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
  canvas.width = r.width * d; canvas.height = r.height * d;
}
addEventListener('resize', resize); resize();
let energy = 0;
function draw(t) {
  readMeter();
  const armed = Date.now() < armedUntil;
  const target = speaking ? 0.55 + 0.35 * Math.abs(Math.sin(t / 90) * Math.sin(t / 233))
    : busy ? 0.4 + 0.15 * Math.sin(t / 160)
    : armed ? 0.3 + Math.min(micLevel * 2.5, 0.7)
    : 0.12 + (wakeOn ? Math.min(micLevel, 0.2) : 0);
  energy += (target - energy) * 0.12;
  const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36;
  const hue = permission ? 36 : busy && !speaking ? 190 : 205;
  g.clearRect(0, 0, w, h);
  const glow = g.createRadialGradient(cx, cy, 0, cx, cy, R * (1.1 + energy * 0.5));
  glow.addColorStop(0, `hsla(${hue},100%,75%,${0.55 + energy * 0.4})`);
  glow.addColorStop(0.18, `hsla(${hue},100%,55%,${0.22 + energy * 0.2})`);
  glow.addColorStop(1, 'hsla(210,100%,50%,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(cx, cy, R * 1.6, 0, 7); g.fill();
  const speed = busy ? 2.4 : speaking ? 1.5 : 1;
  for (let i = 0; i < 7; i++) {
    const radius = R * (0.32 + i * 0.115) * (1 + energy * 0.08 * Math.sin(t / 300 + i));
    const dir = i % 2 ? -1 : 1, rot = dir * (t / (1400 + i * 420)) * speed + i;
    const segments = 3 + (i * 2) % 5, gap = 0.18 + (i % 3) * 0.12;
    g.lineWidth = Math.max(1, R * (i % 3 === 0 ? 0.028 : 0.01));
    g.strokeStyle = `hsla(${hue + i * 3},100%,${62 + energy * 20}%,${0.3 + energy * 0.5 - i * 0.02})`;
    for (let s = 0; s < segments; s++) {
      const a0 = rot + (s / segments) * Math.PI * 2;
      g.beginPath(); g.arc(cx, cy, radius, a0, a0 + (Math.PI * 2 / segments) * (1 - gap)); g.stroke();
    }
  }
  g.lineWidth = 1; g.strokeStyle = `hsla(${hue},100%,70%,.35)`;
  for (let k = 0; k < 60; k++) {
    const a = (k / 60) * Math.PI * 2 + t / 9000, len = k % 5 === 0 ? 0.06 : 0.025;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * R * 1.2, cy + Math.sin(a) * R * 1.2);
    g.lineTo(cx + Math.cos(a) * R * (1.2 + len), cy + Math.sin(a) * R * (1.2 + len));
    g.stroke();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- przyciski ----------
function syncWake() {
  $('wake').textContent = 'NASŁUCH: ' + (wakeOn ? 'WŁ.' : 'WYŁ.');
  $('wake').classList.toggle('on', wakeOn);
}
$('wake').onclick = async () => {
  wakeOn = !wakeOn; syncWake();
  if (wakeOn) { await startMeter(); startRec(); } else stopRec();
};
$('mic').onclick = async () => { stopSpeaking(); await startMeter(); arm(10000); startRec(); };
$('text').onkeydown = (e) => { if (e.key === 'Enter') { send(e.target.value); e.target.value = ''; } };
$('stop').onclick = () => { post('/api/stop'); stopSpeaking(); };
$('reset').onclick = async () => { await post('/api/reset'); stopSpeaking(); $('talk').textContent = ''; $('actions').textContent = ''; log('talk', 'Nowa rozmowa. Pamięć trwała została.', ''); };
$('permYes').onclick = () => answerPermission(true);
$('permNo').onclick = () => answerPermission(false);
canvas.onclick = stopSpeaking;

$('hint').textContent = SR
  ? 'Kliknij MÓW i powiedz polecenie. Z włączonym nasłuchem: powiedz „Jarvis, …” albo klaśnij dwa razy.'
  : 'Ta przeglądarka nie rozpoznaje mowy — otwórz Jarvisa w Chrome lub Edge. Pisanie poleceń działa wszędzie.';
if (!SR) { $('mic').disabled = true; $('wake').disabled = true; }
refreshStatus();
</script>
</body>
</html>
