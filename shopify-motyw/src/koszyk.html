<!-- WYSUWANY KOSZYK -->
<style>
  .cart { position: relative; }
  .cart-count { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
  .cart-count[hidden] { display: none; }
  .kosz-tlo { position: fixed; inset: 0; background: rgba(28,36,64,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; }
  .kosz { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: #fff; z-index: 51; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s ease; }
  body.kosz-otwarty { overflow: hidden; }
  body.kosz-otwarty .kosz { transform: none; box-shadow: -10px 0 40px rgba(28,36,64,.18); }
  body.kosz-otwarty .kosz-tlo { opacity: 1; pointer-events: auto; }
  .kosz-head { display: flex; align-items: center; justify-content: space-between; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px; }
  .kosz-head h2 { font-size: 30px; }
  .kosz-x { width: 40px; height: 40px; border: 0; background: none; color: var(--ink); font-size: 34px; line-height: 1; cursor: pointer; }
  .kosz-pasek { background: var(--ink); color: #fff; text-align: center; font-weight: 800; font-size: 14.5px; padding: 12px 16px; }
  .kosz-body { flex: 1; overflow-y: auto; padding: 20px; display: grid; gap: 20px; align-content: start; }
  .poz { display: grid; grid-template-columns: 84px 1fr; gap: 14px; position: relative; }
  .poz img { width: 84px; height: 104px; border-radius: 10px; object-fit: cover; background: var(--peach); }
  .poz-tytul { display: block; font-weight: 800; font-size: 16px; line-height: 1.3; color: var(--ink); padding-right: 30px; }
  .poz-wzor { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .poz-dol { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .ilosc { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; }
  .ilosc button { width: 32px; height: 32px; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--ink); }
  .ilosc span { min-width: 34px; height: 32px; display: grid; place-items: center; border-left: 1.5px solid var(--line); border-right: 1.5px solid var(--line); font-weight: 800; font-size: 14.5px; }
  .poz-cena { text-align: right; font-variant-numeric: tabular-nums; }
  .poz-cena s { color: var(--muted); font-size: 13.5px; margin-right: 4px; }
  .poz-cena b { color: var(--coral-dark); font-size: 17px; }
  .poz-cena small { display: block; font-weight: 800; font-size: 13px; color: var(--ink); margin-top: 2px; }
  .usun { position: absolute; top: 0; right: 0; width: 28px; height: 28px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .usun svg { width: 18px; height: 18px; stroke: var(--muted); }
  .usun:hover svg { stroke: var(--ink); }
  .pusty { text-align: center; padding: 30px 10px; color: var(--muted); }
  .upsell { border: 2px dashed #ffc6b2; border-radius: 14px; padding: 14px; background: #fffaf6; }
  .upsell p { font-size: 14px; color: var(--ink); font-weight: 700; }
  .upsell p span { color: var(--green); }
  .upsell .swatches { margin-top: 10px; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; }
  .kosz-foot { border-top: 1px solid var(--line); padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
  .linia { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; color: var(--ink); }
  .linia.rabat { color: var(--green); font-size: 19px; }
  .linia.razem { font-size: 24px; }
  .linia.dost { color: var(--muted); font-size: 14.5px; font-weight: 700; }
  .kosz-foot .btn { margin-top: 10px; }
  .platnosci { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .platnosci span { height: 26px; min-width: 42px; padding: 0 7px; border: 1px solid var(--line); border-radius: 5px; display: grid; place-items: center; font-size: 11.5px; font-weight: 800; color: var(--ink); background: #fff; }
  .platnosci .blik { background: #000; color: #fff; border-color: #000; text-transform: lowercase; letter-spacing: .02em; }
  .platnosci .visa { background: #1a1f71; color: #fff; border-color: #1a1f71; font-style: italic; }
  .platnosci .mc { display: flex; padding: 0 8px; }
  .platnosci .mc i { width: 14px; height: 14px; border-radius: 50%; background: #eb001b; }
  .platnosci .mc i + i { background: #f79e1b; margin-left: -5px; opacity: .9; }
  /* okno „Wybierz dostawę” przed kasą */
  .dostawa-tlo { position: fixed; inset: 0; z-index: 60; background: rgba(28,36,64,.45); display: none; align-items: flex-end; justify-content: center; padding: 12px; }
  .dostawa-tlo.on { display: flex; }
  .dostawa { position: relative; width: min(460px, 100%); background: #fff; border-radius: 22px; padding: 26px 22px 22px; box-shadow: 0 20px 50px rgba(28,36,64,.3); margin-bottom: env(safe-area-inset-bottom, 0px); }
  @media (min-width: 700px) { .dostawa-tlo { align-items: center; } }
  .dostawa h2 { font-size: 28px; margin-bottom: 18px; padding-right: 50px; }
  .dostawa-x { position: absolute; top: 18px; right: 18px; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--peach); color: var(--ink); font-size: 24px; cursor: pointer; }
  .dostawa a { display: flex; align-items: center; gap: 12px; padding: 20px 22px; border-radius: 14px; border: 1.5px solid var(--line); color: var(--ink); font-weight: 800; font-size: 19px; text-decoration: none; }
  .dostawa a + a { margin-top: 10px; }
  .dostawa a.glowna { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: 0 0 0 4px #fff, 0 0 0 5.5px var(--line); }
  .dostawa a small { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--green); }
  .dostawa a.glowna small { color: #8ff0bf; }
  .dostawa-info { margin-top: 14px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
<div class="kosz-tlo" id="kosz-tlo"></div>
<aside class="kosz" id="kosz" role="dialog" aria-modal="true" aria-label="Koszyk" aria-hidden="true">
  <div class="kosz-head"><h2 id="kosz-tytul">Koszyk</h2><button class="kosz-x" type="button" id="kosz-x" aria-label="Zamknij koszyk">×</button></div>
  <div class="kosz-pasek">🚚 Darmowa dostawa · ↩️ 14 dni na zwrot</div>
  <div class="kosz-body" id="kosz-body"></div>
  <div class="kosz-foot" id="kosz-foot"></div>
</aside>
<div class="dostawa-tlo" id="dostawa-tlo">
  <div class="dostawa" role="dialog" aria-modal="true" aria-labelledby="dostawa-tytul">
    <h2 id="dostawa-tytul">Wybierz dostawę</h2>
    <button class="dostawa-x" type="button" id="dostawa-x" aria-label="Zamknij">×</button>
    <a class="glowna" href="/checkout">📦 Paczkomat InPost<small>GRATIS</small></a>
    <p class="dostawa-info">Swój paczkomat wybierzesz z listy lub mapy zaraz po zapłacie.</p>
  </div>
</div>
<script>
  // wysuwany koszyk: pozycje z rabatem, zmiana ilości, dobranie kolejnej opaski
  (function () {
    var kosz = document.getElementById('kosz');
    var body = document.getElementById('kosz-body');
    var foot = document.getElementById('kosz-foot');
    var tytul = document.getElementById('kosz-tytul');
    var ikona = document.querySelector('.cart');
    var licznik = document.createElement('span');
    licznik.className = 'cart-count';
    licznik.hidden = true;
    if (ikona) ikona.appendChild(licznik);

    function zl(gr) { return (gr / 100).toFixed(2).replace('.', ',') + ' zł'; }
    function rabatZestawu(szt) { return szt >= 3 ? 11998 : szt === 2 ? 4999 : 0; }
    var KOSZ = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';

    function otworz() { document.body.classList.add('kosz-otwarty'); kosz.setAttribute('aria-hidden', 'false'); }
    function zamknij() { document.body.classList.remove('kosz-otwarty'); kosz.setAttribute('aria-hidden', 'true'); }
    document.getElementById('kosz-x').addEventListener('click', zamknij);
    // „Realizuj zakup”: najpierw okno z wyborem dostawy, potem kasa (tam klient wybiera punkt)
    var dostawa = document.getElementById('dostawa-tlo');
    foot.addEventListener('click', function (e) {
      if (e.target.closest('a[href="/checkout"]')) { e.preventDefault(); dostawa.classList.add('on'); }
    });
    document.getElementById('dostawa-x').addEventListener('click', function () { dostawa.classList.remove('on'); });
    dostawa.addEventListener('click', function (e) { if (e.target === dostawa) dostawa.classList.remove('on'); });
    document.getElementById('kosz-tlo').addEventListener('click', zamknij);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') zamknij(); });
    if (ikona) ikona.addEventListener('click', function (e) { e.preventDefault(); otworz(); pokaz(); });

    function api(url, dane) {
      return fetch(url, dane ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dane) } : {})
        .then(function (r) { if (!r.ok) throw r; return r.json(); });
    }

    function upsell(szt) {
      if (szt < 1 || szt >= 3) return '';
      var ile = szt === 1 ? 'Dobierz drugą opaskę za <span>100 zł</span> (zamiast 149,99 zł)' : 'Dobierz trzecią opaskę za <span>80 zł</span> (zamiast 149,99 zł)';
      return '<div class="upsell"><p>➕ ' + ile + ', np. dla rodzeństwa:</p><div class="swatches">' +
        WZORY.map(function (w) {
          return '<button class="swatch" type="button" data-dobierz="' + w.vid + '" title="' + w.nazwa + '" aria-label="Dodaj ' + w.nazwa + '"><img src="' + w.img + '" alt=""></button>';
        }).join('') + '</div></div>';
    }

    function pokaz() {
      return api('/cart.js').then(function (c) {
        var szt = c.item_count;
        licznik.textContent = szt;
        licznik.hidden = !szt;
        tytul.textContent = szt ? 'Koszyk • ' + szt : 'Koszyk';
        if (!szt) {
          body.innerHTML = '<div class="pusty">Twój koszyk jest pusty.<br>Wybierz swojego zwierzaka 🦊🐼🐸</div>';
          foot.innerHTML = '<button class="btn" type="button" id="kosz-wroc">Wybierz opaskę</button>';
          document.getElementById('kosz-wroc').onclick = function () { zamknij(); document.getElementById('kup').scrollIntoView({ behavior: 'smooth' }); };
          return;
        }
        // rabat za zestaw: z Shopify, a gdy go brak (podgląd) – liczony na miejscu i dzielony na pozycje
        var rabat = c.total_discount || rabatZestawu(szt);
        body.innerHTML = c.items.map(function (it) {
          var rabatPoz = c.total_discount ? it.original_line_price - it.final_line_price : Math.round(rabat * it.original_line_price / c.original_total_price);
          return '<div class="poz"><img src="' + (it.image || '') + '" alt="">' +
            '<div><b class="poz-tytul">Lulavi – opaska ze słuchawkami</b><div class="poz-wzor">' + (it.variant_title || it.product_title) + '</div>' +
            '<div class="poz-dol"><span class="ilosc"><button type="button" data-zmien="' + it.key + '" data-ile="' + (it.quantity - 1) + '" aria-label="Mniej">−</button><span>' + it.quantity + '</span>' +
            '<button type="button" data-zmien="' + it.key + '" data-ile="' + (it.quantity + 1) + '" aria-label="Więcej">+</button></span>' +
            '<div class="poz-cena">' + (rabatPoz ? '<s>' + zl(it.original_line_price) + '</s>' : '') + '<b>' + zl(it.original_line_price - rabatPoz) + '</b>' +
            (rabatPoz ? '<small>(Oszczędzasz ' + zl(rabatPoz) + ')</small>' : '') + '</div></div></div>' +
            '<button class="usun" type="button" data-zmien="' + it.key + '" data-ile="0" aria-label="Usuń">' + KOSZ + '</button></div>';
        }).join('') + upsell(szt);
        var razem = c.original_total_price - rabat;
        foot.innerHTML = (rabat ? '<div class="linia rabat"><span>Łączny rabat</span><span>−' + zl(rabat) + '</span></div>' : '') +
          '<div class="linia razem"><span>Łączna kwota</span><span>' + zl(razem) + '</span></div>' +
          '<div class="linia dost"><span>Dostawa</span><span>GRATIS</span></div>' +
          '<a class="btn" href="/checkout">Realizuj zakup</a>' +
          '<div class="platnosci" aria-label="Metody płatności"><span class="blik">blik</span><span class="visa">VISA</span><span class="mc"><i></i><i></i></span><span>Apple Pay</span><span>G Pay</span></div>';
      });
    }

    body.addEventListener('click', function (e) {
      var z = e.target.closest('[data-zmien]');
      var d = e.target.closest('[data-dobierz]');
      if (z) api('/cart/change.js', { id: z.dataset.zmien, quantity: +z.dataset.ile }).then(pokaz);
      if (d) api('/cart/add.js', { items: [{ id: +d.dataset.dobierz, quantity: 1 }] }).then(pokaz);
    });

    // „Dodaj do koszyka”: wybrane wzory trafiają do koszyka, a koszyk się wysuwa
    cta.addEventListener('click', function () {
      var wybrany = document.querySelector('input[name="pakiet"]:checked');
      var ilosci = {};
      wybrany.closest('.offer').querySelectorAll('.swatches').forEach(function (g) {
        var s = g.querySelector('.swatch[aria-checked="true"]');
        if (s) ilosci[s.dataset.vid] = (ilosci[s.dataset.vid] || 0) + 1;
      });
      var items = Object.keys(ilosci).map(function (id) { return { id: +id, quantity: ilosci[id] }; });
      var tekst = cta.textContent;
      cta.disabled = true;
      cta.textContent = 'Dodaję do koszyka…';
      api('/cart/add.js', { items: items })
        .then(pokaz)
        .then(otworz)
        .catch(function () { alert('Nie udało się dodać do koszyka. Spróbuj jeszcze raz.'); })
        .then(function () { cta.disabled = false; cta.textContent = tekst; });
    });

    pokaz();
  })();
</script>
